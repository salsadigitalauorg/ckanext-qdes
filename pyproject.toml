[project]
name = "ckanext-qdes"
version = "3.0.1"
description = "CKAN extension for QDES"
authors = [
	{name = "Salsa Digital", email = "developers@salsa.digital"},
	]
maintainers = [
	{name = "Mark Calvert", email = "mark.calvert@salsa.digital"},
	{name = "Konstantin Sivakov", email = "konstantin.sivakov@salsa.digital"},
	{name = "Awang Setyawan", email = "awang.setyawan@salsa.digital"},
	]
license = { text = "AGPL-3.0" }
readme = "README.md"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Framework :: CKAN",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: GNU Affero General Public License v3",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Internet :: WWW/HTTP",
	"Topic :: Internet :: WWW/HTTP :: Dynamic Content",
	"Topic :: Software Development :: Libraries :: Python Modules",
	]
keywords = ["ckan", "extension", "qdes"]

dependencies = []

[project.urls]
Repository = "https://github.com/salsadigitalauorg/ckanext-qdes"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.entry-points."ckan.plugins"]
qdes = "ckanext.qdes.plugin:QdesPlugin"
qdes_access = "ckanext.qdes.access.plugin:QdesAccessPlugin"

# Ruff config mirrors CKAN core (ckan/pyproject.toml [tool.ruff]).
# Lint is correctness-only (E501/W omitted - not enforced yet).
# line-length = 120 diverges from core's 88 deliberately (PEP 8's
# sanctioned alternate ceiling).
[tool.ruff]
target-version = "py312"  # Python version in the CKAN 2.11 base image
line-length = 120
exclude = [".*", "node_modules"]

[tool.ruff.lint]
select = ["F", "E7", "E9", "E722"]

# quote-style = "preserve": core has no formatter of its own, but its
# written style guide (doc/contributing/python.rst) requires context-
# dependent quoting no formatter setting can express - "preserve" is the
# only option that doesn't fight it.
[tool.ruff.format]
quote-style = "preserve"
