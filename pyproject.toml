[project]
name = "ckanext-qdes"
version = "3.0.1"
description = "CKAN extension for QDES"
authors = [
	{name = "Salsa Digital", email = "developers@salsa.digital"},
	]
maintainers = [
	{name = "Mark Calvert", email = "mark.calvert@salsa.digital"},
	{name = "Konstantin Sivakov", email = "konstantin.sivakov@salsa.digital"},
	{name = "Awang Setyawan", email = "awang.setyawan@salsa.digital"},
	]
license = { text = "AGPL-3.0" }
readme = "README.md"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Framework :: CKAN",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: GNU Affero General Public License v3",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Internet :: WWW/HTTP",
	"Topic :: Internet :: WWW/HTTP :: Dynamic Content",
	"Topic :: Software Development :: Libraries :: Python Modules",
	]
keywords = ["ckan", "extension", "qdes"]

dependencies = []

[project.urls]
Repository = "https://github.com/salsadigitalauorg/ckanext-qdes"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.entry-points."ckan.plugins"]
qdes = "ckanext.qdes.plugin:QdesPlugin"
qdes_access = "ckanext.qdes.access.plugin:QdesAccessPlugin"

# Mirrors CKAN core's use of ruff (see ckan/pyproject.toml [tool.ruff]).
# Correctness-only: E501/W are deliberately omitted. Enabling CKAN's
# line-length of 88 would report 1118 E501 violations across the QDES
# extensions, and reformatting is out of scope.
[tool.ruff]
target-version = "py312"  # Python version in the CKAN 2.11 base image
exclude = [".*", "node_modules"]

[tool.ruff.lint]
select = ["F", "E7", "E9", "E722"]
